<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Class</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        font-family: 'Montserrat', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #F8F5F0;
        position: relative;
        padding: 20px;
        background: url("croom.jpg") center / cover no-repeat;
    }
    body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #1E1E1ED9;
        z-index: 0;
    }
    body > * { position: relative; z-index: 1; }
    .bckbtn {
        align-self: flex-start;
        width: 100px;
        padding: 10px 16px;
        margin-bottom: 20px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        background-color: #000000;
        color: #FFFFFF;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s ease;
    }
    .bckbtn:hover {
        background-color: #232323;
    }
    .container {
        width: 100%;
        max-width: 450px;
        padding: 25px;
        background: #F5F2ED26; 
        border-radius: 12px;
        box-shadow: 0 6px 15px #00000080;
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    label { width: 100%; max-width: 400px; margin-bottom: 5px; font-weight: bold; color: #F8F5F0; }
    input, select {
        width: 100%;
        max-width: 400px;
        padding: 10px;
        margin-bottom: 15px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        background-color: #FFFDF9;
        color: #222222;
    }
    button {
        padding: 10px 16px;
        margin-bottom: 15px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        background-color: #000000;
        color: #FFFFFF;
        cursor: pointer;
        font-weight: bold;
        width: 40%;
        transition: background-color 0.3s ease;
    }
    button:hover {
        background-color: #232323;
    }
    #roomDetails, #summary, #message { width: 100%; max-width: 400px; margin-bottom: 15px; }
    #summary { display: none; background-color: #FFFFFF24; padding: 15px; border-radius: 10px; color: #F8F5F0; }
    #roomDetails { display: none; background-color: #FFFFFF1A; padding: 15px; border-radius: 10px; color: #F8F5F0; }
</style>
</head>
<body>

    <button class="bckbtn" onclick="window.location.href='dashboard.html'">← Back</button>

    <div class="container">
        <h2>Register a Class Session</h2>

        <label>Student ID:</label>
        <input type="text" id="studentID" placeholder="e.g. 2023001-S" required />

        <label>Course:</label>
        <select id="courseID" required>
            <option value="">-- Select Course --</option>
        </select>

        <label>Date:</label>
        <input type="date" id="date" required />

        <label>Start Time:</label>
        <select id="starttime" onchange="updateEndTimes()" required>
            <option value="">-- Select Start Time --</option>
        </select>

        <label>End Time:</label>
        <select id="endtime" onchange="loadRooms()" required>
            <option value="">-- Select Start Time first --</option>
        </select>

        <label>Available Room:</label>
        <select id="classroomID" onchange="showRoomDetails()" required>
            <option value="">-- Pick date and time first --</option>
        </select>

        <div id="roomDetails">
            <strong>Room Details:</strong><br>
            <span id="roomName"></span><br>
            <span id="roomID"></span><br>
            <span id="roomCategory"></span>
        </div>

        <div id="summary">
            <strong>Summary:</strong><br>
            <span id="summaryText"></span>
        </div>

        <button onclick="submitClass()">Submit</button>
        <button onclick="resetForm()">Clear</button>

        <p id="message"></p>
    </div>

<script>
    /* Your Original Logic - Restored */
    let availableRooms = [];
    let startDatetime = '';
    let endDatetime = '';

    const allSlots = [];
    for (let hour = 7; hour <= 22; hour++) {
        const minutes = hour === 22 ? [0] : [0, 30];
        minutes.forEach(min => allSlots.push({ hour, min }));
    }

    function toAMPM(hour, min) {
        const period = hour >= 12 ? 'PM' : 'AM';
        const h = hour % 12 === 0 ? 12 : hour % 12;
        return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')} ${period}`;
    }

    function toMinutes(hour, min) {
        return hour * 60 + min;
    }

    function generateStartTimes() {
        const startSelect = document.getElementById('starttime');
        allSlots.forEach(slot => {
            if (toMinutes(slot.hour, slot.min) <= toMinutes(19,0)) {
                const hh = String(slot.hour).padStart(2,'0');
                const mm = String(slot.min).padStart(2,'0');
                const opt = document.createElement('option');
                opt.value = `${hh}:${mm}`;
                opt.textContent = toAMPM(slot.hour, slot.min);
                opt.dataset.hour = slot.hour;
                opt.dataset.min = slot.min;
                startSelect.appendChild(opt);
            }
        });
    }

    function updateEndTimes() {
        const startSelect = document.getElementById('starttime');
        const endSelect = document.getElementById('endtime');
        const selectedOpt = startSelect.selectedOptions[0];
        endSelect.innerHTML = '<option value="">-- Select End Time --</option>';
        document.getElementById('classroomID').innerHTML = '<option value="">-- Pick date and time first --</option>';
        
        if (!selectedOpt || !selectedOpt.value) return;

        const startHour = parseInt(selectedOpt.dataset.hour);
        const startMin = parseInt(selectedOpt.dataset.min);
        const startMins = toMinutes(startHour, startMin);
        const maxMins = startMins + 180;

        allSlots.forEach(slot => {
            const slotMins = toMinutes(slot.hour, slot.min);
            if (slotMins > startMins && slotMins <= maxMins && slotMins <= toMinutes(22,0)) {
                const hh = String(slot.hour).padStart(2,'0');
                const mm = String(slot.min).padStart(2,'0');
                const opt = document.createElement('option');
                opt.value = `${hh}:${mm}`;
                opt.textContent = toAMPM(slot.hour, slot.min);
                endSelect.appendChild(opt);
            }
        });
    }

    function buildDatetime() {
        const date = document.getElementById('date').value;
        const start = document.getElementById('starttime').value;
        const end = document.getElementById('endtime').value;
        if (date && start) startDatetime = `${date} ${start}:00`;
        if (date && end) endDatetime = `${date} ${end}:00`;
    }

    async function loadCourses() {
        try {
            const res = await fetch('/schedule/courses');
            const courses = await res.json();
            const dropdown = document.getElementById('courseID');
            courses.forEach(c => {
                const option = document.createElement('option');
                option.value = c.courseID;
                option.textContent = `${c.name} - ${c.description}`;
                dropdown.appendChild(option);
            });
        } catch (err) { console.error(err); }
    }

    async function loadRooms() {
        buildDatetime();
        if (!startDatetime || !endDatetime) return;
        try {
            const res = await fetch(`/schedule/available-rooms?starttime=${startDatetime}&endtime=${endDatetime}`);
            availableRooms = await res.json();
            const dropdown = document.getElementById('classroomID');
            dropdown.innerHTML = '<option value="">-- Select a Room --</option>';
            availableRooms.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.classroomID;
                opt.textContent = `${r.name} (${r.category})`;
                dropdown.appendChild(opt);
            });
        } catch (err) { console.error(err); }
    }

    function showRoomDetails() {
        const classroomID = document.getElementById('classroomID').value;
        const room = availableRooms.find(r => r.classroomID == classroomID);
        if (!room) return;
        document.getElementById('roomDetails').style.display = 'block';
        document.getElementById('roomName').textContent = `Room Name: ${room.name}`;
        document.getElementById('roomID').textContent = `Room ID: ${room.classroomID}`;
        document.getElementById('roomCategory').textContent = `Category: ${room.category}`;

        document.getElementById('summary').style.display = 'block';
        document.getElementById('summaryText').innerHTML = `
            Student ID: ${document.getElementById('studentID').value}<br>
            Course: ${document.getElementById('courseID').selectedOptions[0].text}<br>
            Time: ${document.getElementById('starttime').value} - ${document.getElementById('endtime').value}
        `;
    }

    async function submitClass() {
        buildDatetime();
        const data = {
            studentID: document.getElementById('studentID').value,
            courseID: document.getElementById('courseID').value,
            classroomID: document.getElementById('classroomID').value,
            starttime: startDatetime,
            endtime: endDatetime
        };
        try {
            const res = await fetch('/requests', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            document.getElementById('message').textContent = result.message;
        } catch (err) { document.getElementById('message').textContent = 'Error submitting.'; }
    }

    function resetForm() { location.reload(); }

    window.onload = () => { generateStartTimes(); loadCourses(); };
</script>
</body>
</html>
