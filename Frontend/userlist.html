<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinator List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <style>
   * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Oswald", sans-serif;
    min-height: 100vh;
    padding: 2rem;

    background: url("notees.jpg") center / cover no-repeat;
    position: relative;
    color: #111827;
}


body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: #14162373; 
    z-index: -1;
}


h2 {
    color: #ffffff;
    margin-bottom: 1rem;
    
  color: #ffffff;
  font-size: 1.6rem;
  letter-spacing: 0.5px;
  text-shadow: 0 3px 10px rgba(0,0,0,0.4);
}



table {
    width: 100%;
    border-collapse: collapse;

    background: #FFFFFFE6; 
    backdrop-filter: blur(8px);

    border-radius: 10px;
    overflow: hidden;

    box-shadow: 0 8px 24px #0000001A;
}

th, td {
    border: 2px solid #000000;
    padding: 12px 14px;
    text-align: left;
    font-size: 0.95rem;
}

th {
    background: #1F2937;
    color: #FFFFFF;
    font-weight: bold;
}


tr:nth-child(even) {
    background: #F9FAFB;
}


.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
}


.btn-back {
  padding: 0.55rem 1rem;
  background: #000000;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: 0.2s;
}

.btn-back:hover {
  background: #374151;
  transform: translateY(-1px);
}


.btn-delete {
    padding: 6px 12px;
    background: #EF4444;
    color: #FFFFFF;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
}
.btn-delete:hover {
    background: #DC2626;
}


.message {
    margin-top: 1rem;
    font-weight: bold;
    color: #111827;
}
    </style>
</head>
<body>

    <div class="top-bar">
        <h2>Registered Coordinators</h2>
        <button class="btn-back" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>User ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email Address</th>
                <th>Account Created</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <tr><td colspan="6">Loading coordinators...</td></tr>
        </tbody>
    </table>

    <p class="message" id="message"></p>

    <script>
        async function loadUsers() {
            const tbody = document.getElementById('userTableBody');
            try {
                const res = await fetch('/admin/users');
                const users = await res.json();

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6">No coordinators found.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                users.forEach(u => {
                    const date = new Date(u.account_created).toLocaleDateString(undefined, {
                        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    tbody.innerHTML += `
                        <tr>
                            <td>${u.userID}</td>
                            <td>${u.firstname || '-'}</td>
                            <td>${u.lastname || '-'}</td>
                            <td>${u.email}</td>
                            <td>${date}</td>
                            <td>
                                <button class="btn-delete" onclick="deleteUser(${u.userID}, '${u.firstname} ${u.lastname}')">
                                    Delete Account
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                document.getElementById('message').textContent = 'Error: Could not connect to the server.';
                document.getElementById('message').style.color = '#dc3545';
            }
        }

        async function deleteUser(userID, name) {
            if (!confirm(`Are you sure you want to delete the account for ${name}?`)) return;

            try {
                const res = await fetch(`/admin/users/${userID}`, { method: 'DELETE' });
                const result = await res.json();

                const msgEl = document.getElementById('message');
                msgEl.textContent = result.message;
                msgEl.style.color = res.ok ? '#28a745' : '#dc3545';

                if (res.ok) loadUsers(); 
            } catch (err) {
                console.error('Delete error:', err);
            }
        }

        window.onload = loadUsers;
    </script>
</body>
</html>
