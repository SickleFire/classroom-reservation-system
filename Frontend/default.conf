server {
    listen 80;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    # POST-only routes (login, register, reserve)
    location = /login {
        proxy_pass http://node-js-production-defe.up.railway.app/login;
        proxy_set_header Host node-js-production-defe.up.railway.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_http_version 1.1;
    }

    location = /logout {
        proxy_pass http://node-js-production-defe.up.railway.app/logout;
        proxy_set_header Host node-js-production-defe.up.railway.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location = /register/coordinator {
        proxy_pass http://node-js-production-defe.up.railway.app/register/coordinator;
        proxy_set_header Host node-js-production-defe.up.railway.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location = /session/me {
        proxy_pass http://node-js-production-defe.up.railway.app/session/me;
        proxy_set_header Host node-js-production-defe.up.railway.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /schedule/ {
        proxy_pass http://node-js-production-defe.up.railway.app;
        proxy_set_header Host node-js-production-defe.up.railway.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://node-js-production-defe.up.railway.app;
        proxy_set_header Host node-js-production-defe.up.railway.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /reserve {
        proxy_pass http://node-js-production-defe.up.railway.app/reserve;
        proxy_set_header Host node-js-production-defe.up.railway.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Static files — serves login.html, dashboard.html, etc.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}