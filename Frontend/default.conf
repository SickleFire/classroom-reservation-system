server {
    listen 80;
    server_name _;

    # Disable any HTTPS redirect — Railway handles SSL termination externally
    absolute_redirect off;
    port_in_redirect off;

    # All API/backend routes
    location ~ ^/(login|logout|register|session|reserve|schedule|admin|dashboard\.html) {
        proxy_pass http://node-js-production-defe.up.railway.app;
        proxy_set_header Host node-js-production-defe.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect default;
    }

    # Static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}