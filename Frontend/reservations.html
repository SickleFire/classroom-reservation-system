<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Schedule List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Oswald", sans-serif;
  padding: 2rem;
  min-height: 100vh;
  background: url("notees.jpg") center / cover no-repeat;
  color: #111827;
  position: relative;
}

/* overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: #14162373;
  z-index: -1;
}

/* top bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}

/* title */
h2 {
  color: #ffffff;
  font-size: 1.6rem;
  letter-spacing: 0.5px;
  text-shadow: 0 3px 10px rgba(0,0,0,0.4);
}

/* table */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
}

/* header */
th {
  background: #1f2937;
  color: #ffffff;
  padding: 14px;
  text-align: left;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

/* cells */
td {
  padding: 12px 14px;
  font-size: 0.85rem;
  border-bottom: 1px solid #e5e7eb;
}

/* zebra */
tr:nth-child(even) td {
  background: #f6f7f9;
}

/* hover */
tr:hover td {
  background: #eef2f7;
}

/* STATUS FIX */
.status-scheduled {
  color: #22c55e;
  font-weight: 600;
}

.status-cancelled {
  color: #ef4444;
  font-weight: 600;
}

/* badge */
.badge-weekly {
  background: #2563eb;
  color: #fff;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.72rem;
}

/* back button */
.btn-back {
  padding: 0.55rem 1rem;
  background: #000000;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: 0.2s ease;
}

.btn-back:hover {
  background: #374151;
  transform: translateY(-1px);
}

/* action buttons */
.action-btn {
  padding: 5px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.78rem;
  margin-right: 5px;
  transition: 0.2s ease;
}

/* DELETE FIX */
.btn-cancel {
  background: #ef4444;
  color: white;
}

.btn-cancel:hover {
  background: #903131;
  transform: translateY(-1px);
}
</style>
</head>

<body>

<div class="top-bar">
  <h2 id="table-title">Class Schedule List</h2>
  <button class="btn-back" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Course</th>
      <th>Weekly?</th>
      <th>Start Time</th>
      <th>End Time</th>
      <th>Teacher</th>
      <th>Classroom</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="scheduleTableBody">
    <tr><td colspan="9">Loading schedule data...</td></tr>
  </tbody>
</table>

<script>
let allSchedules = [];
let currentUser = null;

async function checkSession() {
  try {
    const res = await fetch('/session/me');
    if (!res.ok) throw new Error('Not logged in');

    currentUser = await res.json();

    if (currentUser.role === 'admin' || currentUser.role === 'coordinator') {
      document.getElementById('table-title').innerText =
        "Management: Class Schedules";
    }

    loadSchedules();
  } catch (err) {
    window.location.href = 'index.html';
  }
}

async function loadSchedules() {
  try {
    const res = await fetch('/reservations');
    allSchedules = await res.json();
    renderTable();
  } catch (err) {
    alert('Could not load schedules');
  }
}

function renderTable() {
  const tbody = document.getElementById('scheduleTableBody');

  if (!allSchedules || allSchedules.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;">No scheduled classes found.</td></tr>`;
    return;
  }

  tbody.innerHTML = '';

  allSchedules.forEach(item => {
    const id = item.implementationID || item.implementation_id;
    if (!id) return;

    const teacher = item.teacher_fname
      ? `${item.teacher_fname} ${item.teacher_lname}`
      : 'Unassigned';

    const isWeekly = item.is_weekly
      ? `<span class="badge-weekly">Weekly</span>`
      : 'One-time';

    /* ✅ FIXED STATUS LOGIC */
    const status = (item.status || 'Scheduled').toLowerCase();

    const statusClass =
      status === 'scheduled' || status === 'approved'
        ? 'status-scheduled'
        : 'status-cancelled';

    const row = `
      <tr>
        <td>${id}</td>
        <td><strong>${item.course_name || 'N/A'}</strong></td>
        <td>${isWeekly}</td>
        <td>${new Date(item.starttime).toLocaleString()}</td>
        <td>${new Date(item.endtime).toLocaleString()}</td>
        <td>${teacher}</td>
        <td>${item.classroom_name || 'N/A'}</td>
        <td class="${statusClass}">${item.status || 'Scheduled'}</td>
        <td>
          <button id="del-btn-${id}"
            class="action-btn btn-cancel"
            onclick="deleteReservation(${id})">
            Delete
          </button>
        </td>
      </tr>
    `;

    tbody.innerHTML += row;
  });
}

async function deleteReservation(id) {
  if (!confirm(`Are you sure you want to delete Reservation #${id}?`)) return;

  const btn = document.getElementById(`del-btn-${id}`);
  btn.disabled = true;
  btn.innerText = '...';

  try {
    const res = await fetch(`/reservations/${id}`, { method: 'DELETE' });
    const result = await res.json().catch(() => ({}));

    if (res.ok) {
      alert(`Successfully Deleted: Reservation #${id}`);
      loadSchedules();
    } else {
      alert(result.message || 'Failed to delete reservation.');
      btn.disabled = false;
      btn.innerText = 'Delete';
    }
  } catch (err) {
    alert('Server error during delete.');
    btn.disabled = false;
    btn.innerText = 'Delete';
  }
}

window.onload = checkSession;
</script>

</body>
</html>
