<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Schedule List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Oswald", sans-serif;
  padding: 2rem;
  min-height: 100vh;
  background: url("notees.jpg") center / cover no-repeat;
  color: #111827;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: #14162373;
  z-index: -1;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}

h2 {
  color: #ffffff;
  font-size: 1.6rem;
  letter-spacing: 0.5px;
  text-shadow: 0 3px 10px rgba(0,0,0,0.4);
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
}

th {
  background: #1f2937;
  color: #ffffff;
  padding: 14px;
  text-align: left;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

td {
  padding: 12px 14px;
  font-size: 0.85rem;
  border-bottom: 1px solid #e5e7eb;
  vertical-align: middle;
}

tr:nth-child(even) td { background: #f6f7f9; }
tr:hover td { background: #eef2f7; }

.badge-weekly {
  background: #2563eb;
  color: #fff;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.72rem;
}

.teacher-cell {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.teacher-name {
  font-weight: 600;
  color: #111827;
}
.teacher-id {
  font-size: 0.72rem;
  color: #6b7280;
  background: #e5e7eb;
  border-radius: 4px;
  padding: 1px 6px;
  display: inline-block;
  width: fit-content;
}
.unassigned {
  color: #9ca3af;
  font-style: italic;
  font-size: 0.82rem;
}

.btn-back {
  padding: 0.55rem 1rem;
  background: #000000;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  font-family: "Oswald", sans-serif;
  transition: 0.2s ease;
}
.btn-back:hover {
  background: #374151;
  transform: translateY(-1px);
}

.action-btn {
  padding: 5px 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.78rem;
  font-family: "Oswald", sans-serif;
  transition: 0.2s ease;
}
.btn-cancel {
  background: #ef4444;
  color: white;
}
.btn-cancel:hover {
  background: #903131;
  transform: translateY(-1px);
}
</style>
</head>

<body>

<div class="top-bar">
  <h2>Class Schedule List</h2>
  <button class="btn-back" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Course</th>
      <th>Weekly?</th>
      <th>Start Time</th>
      <th>End Time</th>
      <th>Teacher</th>
      <th>Classroom</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="scheduleTableBody">
    <tr><td colspan="8">Loading schedule data...</td></tr>
  </tbody>
</table>

<script>
let allSchedules = [];
let teacherMap = {};  // teacherID → { firstname, lastname }

async function checkSession() {
  try {
    const res = await fetch('/session/me');
    if (!res.ok) throw new Error('Not logged in');
    await res.json();
    await loadTeacherMap();  // load teachers first so names are ready
    loadSchedules();
  } catch (err) {
    window.location.href = 'index.html';
  }
}

// Fetch all teachers and build an ID → name lookup
async function loadTeacherMap() {
  try {
    const res = await fetch('/admin/teachers');
    const teachers = await res.json();
    teachers.forEach(t => {
      teacherMap[t.teacherID] = { firstname: t.firstname, lastname: t.lastname };
    });
  } catch (err) {
    console.error('Could not load teacher map:', err);
  }
}

async function loadSchedules() {
  try {
    const res = await fetch('/reservations');
    allSchedules = await res.json();
    renderTable();
  } catch (err) {
    alert('Could not load schedules');
  }
}

function renderTable() {
  const tbody = document.getElementById('scheduleTableBody');

  if (!allSchedules || allSchedules.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;">No scheduled classes found.</td></tr>`;
    return;
  }

  tbody.innerHTML = '';

  allSchedules.forEach(item => {
    const id            = item.implementation_id;
    const courseName    = item.course_name    || 'N/A';
    const classroomName = item.classroom_name || 'N/A';

    const isWeekly = item.is_weekly
      ? `<span class="badge-weekly">Weekly</span>`
      : 'One-time';

    // Rust returns teacher_id_opt (null if unassigned)
    const tid = item.teacher_id_opt;
    let teacherCell;
    if (tid && teacherMap[tid]) {
      const t = teacherMap[tid];
      teacherCell = `
        <div class="teacher-cell">
          <span class="teacher-name">${t.firstname} ${t.lastname}</span>
          <span class="teacher-id">ID #${tid}</span>
        </div>`;
    } else if (tid) {
      // Has an ID but somehow not in the map
      teacherCell = `<span class="teacher-id">ID #${tid}</span>`;
    } else {
      teacherCell = `<span class="unassigned">Unassigned</span>`;
    }

    tbody.innerHTML += `
      <tr>
        <td>${id}</td>
        <td><strong>${courseName}</strong></td>
        <td>${isWeekly}</td>
        <td>${new Date(item.starttime).toLocaleString()}</td>
        <td>${new Date(item.endtime).toLocaleString()}</td>
        <td>${teacherCell}</td>
        <td>${classroomName}</td>
        <td>
          <button id="del-btn-${id}" class="action-btn btn-cancel"
            onclick="deleteReservation(${id})">
            Delete
          </button>
        </td>
      </tr>
    `;
  });
}

async function deleteReservation(id) {
  if (!confirm(`Are you sure you want to delete Reservation #${id}?`)) return;

  const btn = document.getElementById(`del-btn-${id}`);
  btn.disabled = true;
  btn.innerText = '...';

  try {
    const res = await fetch(`/reservations/${id}`, { method: 'DELETE' });
    const result = await res.json().catch(() => ({}));

    if (res.ok) {
      alert(`Successfully Deleted: Reservation #${id}`);
      loadSchedules();
    } else {
      alert(result.message || 'Failed to delete reservation.');
      btn.disabled = false;
      btn.innerText = 'Delete';
    }
  } catch (err) {
    alert('Server error during delete.');
    btn.disabled = false;
    btn.innerText = 'Delete';
  }
}

window.onload = checkSession;
</script>

</body>
</html>
