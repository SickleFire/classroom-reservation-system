<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Web Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f9f9f9;
        }
        h1 {
            color: #4a90e2;
        }
        p {
            font-size: 1.1rem;
        }
        form {
            margin-top: 2rem;
        }
        button {
            padding: 0.7rem 1.2rem;
            background-color: #4a90e2;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #357ab8;
        }
    </style>
</head>
<body>
    <h1>Hello from JS!</h1>
    <p>This page is being served by your Node js backend.</p>
    
    <p><a href="login.html">Go to Login</a></p>

    <!-- Reservation form -->
    <form action="/reserve" method="POST">
        <label for="room">Room Number:</label>
        <input type="text" id="room" name="room" required>

        <label for="time">Reservation Time:</label>
        <input type="text" id="time" name="time" placeholder="YYYY-MM-DD HH:MM" required>

        <button type="submit">Submit Reservation</button>
    </form>
</body>
</html>
