<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinator Login - Classroom Reservation</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('teacher.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Dark overlay for readability */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0,0,0,0.6);
            z-index: 0;
        }

        .login-container {
            position: relative; 
            z-index: 1;
            background: rgba(255, 255, 255, 0.98);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 320px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .login-container p.subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #444;
            font-weight: bold;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1.2rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #0e3a8c; /* Coordinator Orange */
        }

        .btn-coordinator {
            width: 100%; 
            padding: 0.8rem;
            background: #0e3a8c; /* Deep Orange */
            border: none;
            border-radius: 6px; 
            color: #fff;
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-coordinator:hover {
            background: #5257dc;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #3b62b0;
        }

        .footer a { color: #0c2b4f; text-decoration: none; font-weight: bold; }
        .footer a:hover { text-decoration: underline; }

        .message {
            text-align: center;
            font-size: 0.85rem;
            color: #dc3545;
            margin-top: 1rem;
            min-height: 20px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Coordinator Login</h2>
    <p class="subtitle">Classroom Management System</p>
    
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="name@gmail.com" required>
    
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required>
    
    <button id="loginBtn" class="btn-coordinator" onclick="submitLogin()">Login</button>
    
    <p class="message" id="message"></p>
    
    <div class="footer">
        <p><br> <a href="register.html">Request Account</a></p>
    </div>
</div>

<script>
    // At the top of your script, before submitLogin
window.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/session/me', { credentials: 'include' });
        if (res.ok) {
            // Already logged in — go straight to dashboard
            window.location.href = 'dashboard.html';
        }
    } catch (err) {
        // Not logged in, stay on login page
    }
});
async function submitLogin() {
    const email    = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const message  = document.getElementById('message');

    if (!email || !password) {
        message.textContent = 'Please enter your credentials.';
        return;
    }

    try {
        const res = await fetch('/login', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ email, password }),
            credentials: 'include'
        });

        const contentType = res.headers.get('content-type');
        if (!contentType || !contentType.includes('application/json')) {
        message.textContent = 'Server error. Please try again.';
        console.error('Non-JSON response:', res.status, res.url);
        return;
        }

        const result = await res.json();

        if (res.ok) {
            // Save info and redirect to dashboard
            localStorage.setItem('role', result.role);
            localStorage.setItem('fullname', result.fullname);
            window.location.href = result.redirect;
        } else {
            message.textContent = result.message;
        }
    } catch (err) {
        console.log(err);
        message.textContent = 'Connection error. Please try again.';
    }
}
</script>
</body>
</html>
