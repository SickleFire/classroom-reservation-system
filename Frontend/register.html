<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Reservation - Register</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #FFFFFF;
    position: relative;
    padding: 20px;
    background-image: url("stdnt.jpg"); /* default student */
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: background 0.5s ease-in-out;
}
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-color: rgba(0,0,0,0.7);
    transition: background 0.5s ease-in-out;
}
.register-container {
    position: relative;
    z-index: 1;
    background: #FFFFFF;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 4px 12px #0000001A;
    width: 350px;
}
.register-container h2 {
    text-align: center;
    margin-bottom: 1rem;
    color: #333333;
}
.toggle {
    display: flex;
    border: 1px solid #CCCCCC;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 1.5rem;
}
.toggle button {
    flex: 1;
    padding: 0.5rem;
    border: none;
    background: #F4F6F9;
    color: #555555;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.2s, color 0.2s;
}
.toggle button.active-student {
    background: #000000;
    color: #FFFFFF;
}
.toggle button.active-teacher {
    background: #1D95F7;
    color: #FFFFFF;
}
label {
    display: block;
    margin-bottom: 0.5rem;
    color: #555555;
}
input {
    width: 100%;
    padding: 0.6rem;
    margin-bottom: 1rem;
    border: 1px solid #CCCCCC;
    border-radius: 4px;
    box-sizing: border-box;
}
.btn-student {
    width: 100%;
    padding: 0.7rem;
    background: #050505;
    border: none;
    border-radius: 4px;
    color: #FFFFFF;
    font-weight: bold;
    cursor: pointer;
}
.btn-student:hover {
    background: #414241;
}
.btn-teacher {
    width: 100%;
    padding: 0.7rem;
    background: #007BFF;
    border: none;
    border-radius: 4px;
    color: #FFFFFF;
    font-weight: bold;
    cursor: pointer;
}
.btn-teacher:hover {
    background: #0056B3;
}
.footer {
    text-align: center;
    margin-top: 1.5rem;
    color: #555555; 
    width: 100%;  
    font-size: 15px; 
}

.footer p {
    margin: 0;     
}
.footer a {
    color: #007BFF;
    text-decoration: none;
    font-weight: bold;
}

.footer a:hover {
    text-decoration: underline;
}   
.message {
    text-align: center;
    font-size: 0.85rem;
    margin-top: 0.5rem;
    min-height: 20px;
}
.message.error {
    color: #dc3545;
}
.message.success {
    color: #28a745;
}
</style>
</head>
<body>
<div class="register-container">
    <h2>Create Account</h2>
    <div class="toggle">
        <button type="button" id="btnStudent" class="active-student" onclick="switchRole('student')">Student</button>
        <button type="button" id="btnTeacher" onclick="switchRole('teacher')">Teacher</button>
    </div>
    <label for="firstname">First Name</label>
    <input type="text" id="firstname" placeholder="Juan" required>
    <label for="lastname">Last Name</label>
    <input type="text" id="lastname" placeholder="Dela Cruz" required>
    <label for="phone">Phone Number</label>
    <input type="text" id="phone" placeholder="09171234567" required>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email" required>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required>
    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" placeholder="••••••••" required>
    <button type="button" id="registerBtn" class="btn-student" onclick="submitRegister()">Register as Student</button>
    <p class="message" id="message"></p>
    <div class="footer">
        <p>Already have an account? <a href="index.html">Login</a></p>
    </div>
</div>

<script>
let currentRole = 'student';

function switchRole(role) {
    currentRole = role;
    const btnStudent = document.getElementById('btnStudent');
    const btnTeacher = document.getElementById('btnTeacher');
    const registerBtn = document.getElementById('registerBtn');
    const body = document.body;

    if (role === 'student') {
        btnStudent.className = 'active-student';
        btnTeacher.className = '';
        registerBtn.className = 'btn-student';
        registerBtn.textContent = 'Register as Student';
        body.style.backgroundImage = "url('stdnt.jpg')";
    } else {
        btnStudent.className = '';
        btnTeacher.className = 'active-teacher';
        registerBtn.className = 'btn-teacher';
        registerBtn.textContent = 'Register as Teacher';
        body.style.backgroundImage = "url('teacher.jpg')";
    }


    const msgEl = document.getElementById('message');
    msgEl.textContent = '';
    msgEl.className = 'message';
}

async function submitRegister() {
    const firstname = document.getElementById('firstname').value.trim();
    const lastname = document.getElementById('lastname').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const msgEl = document.getElementById('message');

    if (!firstname || !lastname || !phone || !email || !password || !confirm_password) {
        msgEl.className = 'message error';
        msgEl.textContent = 'Please fill in all fields.';
        return;
    }
    if (password !== confirm_password) {
        msgEl.className = 'message error';
        msgEl.textContent = 'Passwords do not match.';
        return;
    }

    const endpoint = currentRole === 'student' ? '/register/student' : '/register/teacher';
    try {
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ firstname, lastname, phone, email, password })
        });
        const result = await res.json();
        if (res.ok) {
            msgEl.className = 'message success';
            msgEl.textContent = currentRole === 'student' 
                ? `Registered! Your Student ID is: ${result.studentID}` 
                : `Registered! Your Teacher ID is: ${result.teacherID}`;
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
            msgEl.className = 'message error';
            msgEl.textContent = result.message || 'Registration failed.';
        }
    } catch (err) {
        msgEl.className = 'message error';
        msgEl.textContent = 'Registration failed. Please try again.';
    }
}
</script>
</body>
</html>
