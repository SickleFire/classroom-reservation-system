<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Reservation - Register</title>
    <style>
        /* ... existing styles ... */
        body { background-image: url("teacher.jpg"); }
        .register-container { width: 400px; }
    </style>
</head>
<body>
<div class="register-container">
    <h2>Coordinator Registration</h2>
    
    <label for="firstname">First Name</label>
    <input type="text" id="firstname" placeholder="Juan" required>
    
    <label for="lastname">Last Name</label>
    <input type="text" id="lastname" placeholder="Dela Cruz" required>
    
    <label for="email">Institutional Email</label>
    <input type="email" id="email" placeholder="juan.delacruz@school.edu" required>
    
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required>
    
    <label for="confirm_password">Confirm Password</label>
    <input type="password" id="confirm_password" placeholder="••••••••" required>
    
    <button type="button" id="registerBtn" class="btn-teacher" onclick="submitRegister()">Create Coordinator Account</button>
    
    <p class="message" id="message"></p>
    <div class="footer">
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
</div>

<script>
async function submitRegister() {
    const firstname = document.getElementById('firstname').value.trim();
    const lastname = document.getElementById('lastname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const msgEl = document.getElementById('message');

    if (!firstname || !lastname || !email || !password || !confirm_password) {
        msgEl.className = 'message error';
        msgEl.textContent = 'Please fill in all fields.';
        return;
    }
    if (password !== confirm_password) {
        msgEl.className = 'message error';
        msgEl.textContent = 'Passwords do not match.';
        return;
    }

    try {
        const res = await fetch('/register/coordinator', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ firstname, lastname, email, password })
        });
        
        const result = await res.json();
        if (res.ok) {
            msgEl.className = 'message success';
            msgEl.textContent = `Success! Coordinator ID: ${result.coordinatorID}`;
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
            msgEl.className = 'message error';
            msgEl.textContent = result.message || 'Registration failed.';
        }
    } catch (err) {
        msgEl.className = 'message error';
        msgEl.textContent = 'Server error. Please try again.';
    }
}
</script>
</body>
</html>
