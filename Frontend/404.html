<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding-top: 10%;
        }
        h1 {
            font-size: 4rem;
            color: #e74c3c;
        }
        p {
            font-size: 1.2rem;
            color: #555;
        }
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Oops! The page you’re looking for doesn’t exist.</p>
    <p><a href="/">Go back to Home</a></p>
</body>
</html>
