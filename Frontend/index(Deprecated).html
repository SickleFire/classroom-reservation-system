<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classroom Reservation System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background-color: #f9f9f9;
        }
        h1 {
            color: #4a90e2;
        }
        p {
            font-size: 1.1rem;
        }
        form {
            margin-top: 2rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }
        input {
            padding: 0.5rem;
            width: 100%;
            max-width: 300px;
            margin-top: 0.3rem;
        }
        button {
            margin-top: 1.5rem;
            padding: 0.7rem 1.2rem;
            background-color: #4a90e2;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover {
            background-color: #357ab8;
        }
        .nav-link {
            margin-top: 1rem;
            display: inline-block;
            font-weight: bold;
            color: #4a90e2;
            text-decoration: none;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Classroom Reservation System</h1>
    <p>This page is served by your Node.js backend.</p>

    <a class="nav-link" href="login.html">🔐 Go to Login</a>

    <form action="/reserve" method="POST">
        <label for="room">Room Number:</label>
        <input type="text" id="room" name="room" required>

        <label for="time">Reservation Time:</label>
        <input type="text" id="time" name="time" placeholder="YYYY-MM-DD HH:MM" required>

        <button type="submit">Submit Reservation</button>
    </form>
</body>
</html>
